<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameBoost - Gaming Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            background: #111827;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #263244;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            color: #94a3b8;
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
        }

        .card h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 GameBoost</h1>
    <p>Free Gaming Tools & Performance Guides</p>
</header>

<div class="container">

    <!-- DPI CALCULATOR -->
    <div class="card">
        <h2>🎯 DPI Sensitivity Calculator</h2>

        <label for="currentDpi">Current DPI</label>
        <input type="number" id="currentDpi" placeholder="Example: 800">

        <label for="currentSensitivity">Current Sensitivity</label>
        <input type="number" id="currentSensitivity" step="0.01" placeholder="Example: 1.5">

        <label for="newDpi">New DPI</label>
        <input type="number" id="newDpi" placeholder="Example: 1600">

        <button onclick="calculateDPI()">Calculate</button>

        <div id="dpiResult" class="result"></div>
    </div>


    <!-- FPS CHECKER -->
    <div class="card">
        <h2>🎮 FPS & Performance Checker</h2>

        <label for="ram">RAM</label>
        <select id="ram">
            <option value="2">2 GB</option>
            <option value="3">3 GB</option>
            <option value="4">4 GB</option>
            <option value="6">6 GB</option>
            <option value="8">8 GB</option>
            <option value="12">12 GB+</option>
        </select>

        <label for="targetFps">Target FPS</label>
        <select id="targetFps">
            <option value="30">30 FPS</option>
            <option value="60">60 FPS</option>
            <option value="90">90 FPS</option>
            <option value="120">120 FPS</option>
        </select>

        <label for="heat">Device Heat</label>
        <select id="heat">
            <option value="low">Cool</option>
            <option value="medium">Warm</option>
            <option value="high">Very Hot</option>
        </select>

        <button onclick="checkPerformance()">Check Performance</button>

        <div id="performanceResult" class="result"></div>
    </div>


    <!-- GAME PERFORMANCE CHECKER -->
    <div class="card">
        <h2>🎮 Game Performance Checker</h2>

        <label for="deviceName">Device Name</label>
        <input type="text" id="deviceName" placeholder="Example: Vivo Y15">

        <label for="gameName">Game</label>
        <select id="gameName">
            <option value="mlbb">Mobile Legends</option>
            <option value="bloodstrike">Blood Strike</option>
            <option value="freefire">Free Fire</option>
            <option value="roblox">Roblox</option>
        </select>

        <label for="deviceRam">RAM</label>
        <select id="deviceRam">
            <option value="2">2 GB</option>
            <option value="3">3 GB</option>
            <option value="4">4 GB</option>
            <option value="6">6 GB</option>
            <option value="8">8 GB+</option>
        </select>

        <label for="graphics">Graphics Quality</label>
        <select id="graphics">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <label for="fps">Target FPS</label>
        <select id="fps">
            <option value="30">30 FPS</option>
            <option value="60">60 FPS</option>
            <option value="90">90 FPS</option>
            <option value="120">120 FPS</option>
        </select>

        <button onclick="checkGamePerformance()">
            Check Game Performance
        </button>

        <div id="gameResult" class="result"></div>
    </div>

</div>


<footer>
    GameBoost © 2026
</footer>


<script>

function calculateDPI() {

    let currentDpi = Number(document.getElementById("currentDpi").value);
    let currentSensitivity = Number(document.getElementById("currentSensitivity").value);
    let newDpi = Number(document.getElementById("newDpi").value);

    let result = document.getElementById("dpiResult");

    if (
        currentDpi <= 0 ||
        currentSensitivity <= 0 ||
        newDpi <= 0
    ) {
        result.style.display = "block";
        result.innerHTML = "⚠️ Please enter valid numbers.";
        return;
    }

    let newSensitivity =
        (currentDpi * currentSensitivity) / newDpi;

    result.style.display = "block";

    result.innerHTML =
        "🎯 New Sensitivity: <strong>" +
        newSensitivity.toFixed(3) +
        "</strong>";
}


function checkPerformance() {

    let ram = Number(document.getElementById("ram").value);
    let targetFps = Number(document.getElementById("targetFps").value);
    let heat = document.getElementById("heat").value;

    let result = document.getElementById("performanceResult");

    let score = 0;

    if (ram >= 8) {
        score += 3;
    } else if (ram >= 4) {
        score += 2;
    } else {
        score += 1;
    }

    if (targetFps <= 60) {
        score += 2;
    } else {
        score += 1;
    }

    if (heat === "low") {
        score += 2;
    } else if (heat === "medium") {
        score += 1;
    }

    let message = "";

    if (score >= 6) {
        message = "🟢 Good performance potential.";
    } else if (score >= 4) {
        message = "🟡 Medium performance. Try lowering graphics.";
    } else {
        message = "🔴 Low performance. Use low graphics and lower FPS.";
    }

    result.style.display = "block";

    result.innerHTML =
        "<strong>" + message + "</strong><br><br>" +
        "RAM: " + ram + " GB<br>" +
        "Target FPS: " + targetFps + "<br>" +
        "Heat: " + heat;
}


function checkGamePerformance() {

    let device = document.getElementById("deviceName").value;
    let game = document.getElementById("gameName").value;
    let ram = Number(document.getElementById("deviceRam").value);
    let graphics = document.getElementById("graphics").value;
    let fps = Number(document.getElementById("fps").value);

    let result = document.getElementById("gameResult");

    if (device.trim() === "") {
        device = "Your device";
    }

    let recommendation = "";
    let estimated = "";

    if (ram <= 2) {
        recommendation = "Use Low graphics.";
        estimated = "30 FPS recommended.";
    }
    else if (ram <= 4) {
        recommendation = "Use Low to Medium graphics.";
        estimated = "30–60 FPS recommended.";
    }
    else if (ram <= 6) {
        recommendation = "Use Medium graphics.";
        estimated = "60 FPS may be possible.";
    }
    else {
        recommendation = "Medium to High graphics may be possible.";
        estimated = "60–120 FPS depending on the processor/GPU.";
    }

    if (graphics === "high" && ram <= 4) {
        recommendation = "Lower graphics to Low for better stability.";
    }

    if (fps >= 90 && ram <= 4) {
        estimated = "A lower FPS target is recommended.";
    }

    result.style.display = "block";

    result.innerHTML =
        "<strong>🎮 Performance Recommendation</strong><br><br>" +
        "Device: " + device + "<br>" +
        "Recommended: " + recommendation + "<br>" +
        estimated;
}

</script>

</body>
</html>
