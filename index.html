
<!DOCTYPE html>
<html lang="en">
<head>

    <title>GameBoost</title>

    <style>

            background: #101114;

            padding: 25px 20px;

            background: #181a20;

        button {

    </div>

        <button onclick="alert('Performance tools coming soon!')">
